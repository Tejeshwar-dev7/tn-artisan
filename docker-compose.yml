services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: artisanconnect
      MYSQL_USER: artisan
      MYSQL_PASSWORD: ${DB_PASSWORD:-artisan-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/artisanconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: artisan
      DB_PASSWORD: ${DB_PASSWORD:-artisan-local}
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret-with-32chars}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
volumes:
  mysql_data:
