app.public-hosting=true
server.address=0.0.0.0
server.port=${PORT:10000}
spring.main.lazy-initialization=false
server.forward-headers-strategy=framework
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/artisanconnect-v2;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration/{vendor}
server.servlet.jsp.init-parameters.development=false
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
app.jwt.secret=${JWT_SECRET}
