spring.application.name=ArtisanConnect
server.port=${PORT:8080}
server.address=0.0.0.0
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/artisanconnect-v2;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/dev-db
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.jwt.secret=${JWT_SECRET:artisanconnect-development-secret-change-this-32chars}
app.jwt.expiration-minutes=120
app.commission-percent=${COMMISSION_PERCENT:10}
app.payment.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
