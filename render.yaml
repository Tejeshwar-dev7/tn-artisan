services:
  - type: web
    name: tn-artisan
    runtime: docker
    plan: free
    healthCheckPath: /faq
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: hosted
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx300m -XX:+UseSerialGC"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
